name: Release

# HARDENING (t100 -- report: docs/design/reviews/gen3-release-hardening.md)
#
# Three things were wrong here, and each had a cost:
#
#   1. `permissions: contents: write` stood at the WORKFLOW level, so the token
#      held by every job was write-scoped -- including the jobs that only run
#      `npm ci`, `choco install` and `cargo build`. Least privilege is now the
#      workflow DEFAULT (`contents: read`) and the one job that creates a release
#      is the one job that raises it. NB: with a workflow-level `permissions`
#      block, every scope you do NOT list is `none` for jobs that do not override
#      it -- so each job below states what it actually needs (`actions: read` for
#      reading run verdicts, `actions: write` for uploading artifacts) instead of
#      relying on the repository default.
#
#   2. Every `uses:` floated on a tag or branch -- `dtolnay/rust-toolchain@stable`
#      is a MOVING BRANCH -- so the same tag push could execute different code
#      from one day to the next with no change in this repository to review. All
#      actions are now pinned to a commit SHA, with the human-readable ref in a
#      comment. Upgrading one is a deliberate edit:
#        gh api repos/<owner>/<repo>/commits/<ref> --jq .sha   # then update both
#      (Pinning the action does NOT pin the Rust toolchain itself: the INSTALL still
#      floats unless the step passes `with: toolchain:`. Every build step below now does,
#      with the value .github/scripts/check-toolchain-pin.sh holds equal to
#      rust-toolchain.toml -- t40 audit F6. Two reasons it is not merely tidy: the action
#      does not read the toml (its README says the toolchain comes from the action ref), and
#      its master revision has since made that input REQUIRED with no default, so an
#      unpinned step would eventually fail the job outright rather than float quietly.)
#
#   3. The release path ran NO gate: a red commit that got a tag was published as
#      a release. The `gate` job now demands that CI has already reached a green
#      verdict for THIS commit, and both `build` and `release` need it. The gate
#      consumes ci.yml's verdict rather than duplicating a 30-minute suite -- that
#      is what "publish only what the pipeline has passed" means here.

#   4. INTEL MACS HAD NO DOWNLOAD (ruagent-issues-56-59 t82). The matrix carried only
#      `aarch64-apple-darwin`, so a user on an x86_64 Mac found nothing they could run on the
#      release page -- the same class as the panel/README gaps this effort keeps closing: a
#      product nobody can install. `x86_64-apple-darwin` now has its own matrix row, built on
#      `macos-15-intel`: GitHub's own runner table lists only `macos-15-intel`/`macos-26-intel`
#      for Intel macOS (`macos-13`, the obvious answer, is not in it any more; macOS 14 images
#      were retired 2026-11-02). The archive list the checks use is DERIVED from the matrix
#      instead of being written a second time (see the `targets` job).
#
#      VALIDATION, NOT A TAG: a new target is proven by `workflow_dispatch` on a branch, which
#      never publishes (the `release` job is conditioned on the EVENT), and only then by a tag.

on:
  push:
    tags: ["v*"]
  # A VALIDATION PATH THAT CANNOT PUBLISH (ruagent-issues-56-59 t44). Issue #74 asks for macOS
  # archives; the answer is not "add a matrix row and hope the first tag proves it". A dispatch
  # runs the same gate + build + package + smoke + artifact upload on a BRANCH ref, and the
  # `release` job below is conditioned on the EVENT, so a dispatch can never create a release
  # (see its comment: the input is NOT a publish switch). Green here is the evidence a new
  # target needs before it joins the tag-driven matrix.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, package, smoke and upload artifacts. A dispatch NEVER publishes; this records intent.'
        type: boolean
        default: true

# Least privilege by DEFAULT (see note 1 above).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # THE GATE. A tag is a promise that this commit was green; this job is what
  # makes the promise checkable. It asks the Actions API for the CI verdict of
  # THIS commit and refuses to let anything build or publish unless the newest
  # completed CI run for it succeeded:
  #   * no CI run at all      -> fail (nothing proved this commit)
  #   * newest verdict red    -> fail (the defect this gate exists for)
  #   * still running         -> wait, up to 15 minutes, then fail with the state
  #   * success               -> the release jobs may run
  # `contents` is deliberately absent here: this job reads run verdicts and
  # nothing else.
  gate:
    name: Gate (this commit must already be green)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # REQUIRED: reading this commit's runs IS the gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
        with:
          persist-credentials: false # this job reads a manifest and nothing else
      # THE TAG MUST BE THE VERSION THE BINARY REPORTS (ruagent-issues-56-59 t43).
      # v0.1.1 shipped archives whose `--version` said 0.1.0: the tag was cut from a commit whose
      # [workspace.package] version had never been bumped, and nothing downstream looked at it -- the
      # CI gate was green and the smoke test proved the archive runs, both of which were true. The
      # mismatch only surfaces when a user is asked which version they have. Fail here instead.
      - name: Require the tag to match the workspace version
        # TAG-ONLY, and not as a relaxation: a dispatch runs on a BRANCH ref, where
        # github.ref_name is 'main' -- comparing it with the workspace version would fail on a
        # string that is not a tag, and "skip the check" is the wrong fix (the tag path is the
        # one that publishes). The condition keeps the check exactly as strict where it means
        # something, and the tag path cannot reach the build jobs without it.
        if: github.event_name == 'push'
        run: bash .github/scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Require a green CI verdict for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # t44: the SAME check applies to a dispatch (it is about this COMMIT, not about a
          # tag), so the messages below name the event and the ref -- "re-push the tag" would
          # send a dispatcher looking for a tag that does not exist.
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # What this run is: a tag push (publishing path) or a dispatch on a branch (validation
          # path). Only the wording differs -- the demand is identical: THIS commit must be green.
          where="tag $REF (event: $EVENT)"
          if [ "$EVENT" != "push" ]; then
            where="branch $REF via $EVENT"
          fi
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            line=$(gh run list --repo "$REPO" --workflow=ci.yml --commit "$SHA" --limit 1 \
                     --json status,conclusion \
                     --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "")"')
            status=${line%% *}
            conclusion=${line##* }
            echo "CI for ${SHA}: status=${status} conclusion=${conclusion:-<none>}"
            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "gate: green CI verdict for ${SHA}"
                  exit 0
                fi
                echo "::error::the newest CI run for ${SHA} concluded '${conclusion:-unknown}' (${where}). A red commit must not be published, and must not be used as evidence that a new target builds. See https://github.com/${REPO}/actions/runs?query=head_sha%3A${SHA}"
                exit 1
                ;;
              none)
                echo "::error::no CI run found for ${SHA} (${where}). Push this commit to main (or open a PR) and let CI report a verdict. A commit with no verdict is not a release candidate -- and for a dispatch that means: dispatch only a commit CI has already judged."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI for ${SHA} is still '${status}' after 15 minutes; not publishing on an unfinished verdict (${where}). Wait for CI to finish, then re-run."
              exit 1
            fi
            sleep 30
          done

  # THE ONE LIST EVERYTHING ELSE DERIVES FROM (ruagent-issues-56-59 t82).
  #
  # Two facts used to be written twice in this file -- the build matrix, and the archive names
  # that `release` warns about and `completeness` demands. Adding a platform to the matrix and
  # forgetting the list is a silent half-failure in BOTH directions: a release that is missing a
  # platform, or a completeness job that demands an asset nobody builds and so goes red forever.
  # Here there is exactly one place to add a platform; the matrix, the publish pre-check and the
  # completeness check all read THIS job's output. (`strategy.matrix.include` accepts an
  # expression, which is what makes a derived matrix possible at all.)
  #
  # The archive names are built here, with the ref, because every packaging and smoke step below
  # takes `matrix.archive` as given -- keeping that name in the matrix and the naming rule in one
  # place at the same time.
  targets:
    name: Targets (the list the matrix and the checks derive from)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      include: ${{ steps.list.outputs.include }}
      assets: ${{ steps.list.outputs.assets }}
    steps:
      # THE RUNNER LABELS ARE THE PART THAT GOES STALE (t82). Measured today, from GitHub's own
      # runner table (docs.github.com/actions/reference/runners/github-hosted-runners): the Intel
      # macOS labels are `macos-15-intel` and `macos-26-intel`; `macos-13`, the obvious Intel
      # answer, is no longer in that table, and the macOS 14 images were retired 2026-11-02
      # (actions/runner-images). A retired label does not fail fast -- it QUEUES (measured on
      # this very file: three macos legs came back `cancelled` with zero steps). `macos-15-intel`
      # is the OLDEST still-supported Intel image, which is the safest choice for a build that
      # must keep working.
      # An arm64 runner cannot produce an x86_64 binary that RUNS there, so the smoke step below
      # is what proves the pairing: it executes the archive's own binary.
      - name: Emit the target list
        id: list
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$REF" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys

          ref = sys.argv[1]
          # (runner label, rust target triple, archive suffix, archive extension) -- ADD A
          # PLATFORM HERE AND NOWHERE ELSE.
          rows = [
              ("windows-latest", "x86_64-pc-windows-msvc", "x86_64-windows", "zip"),
              ("ubuntu-latest", "x86_64-unknown-linux-gnu", "x86_64-linux", "tar.gz"),
              # macos-latest is arm64 (macos-14 and later are Apple silicon).
              ("macos-latest", "aarch64-apple-darwin", "aarch64-macos", "tar.gz"),
              # Intel Macs: without this row a downloader on x86_64 macOS finds nothing to run.
              ("macos-15-intel", "x86_64-apple-darwin", "x86_64-macos", "tar.gz"),
          ]
          include = [
              {
                  "os": runner,
                  "target": triple,
                  "archive": f"ruagent-{ref}-{suffix}.{ext}",
              }
              for runner, triple, suffix, ext in rows
          ]
          print("include=" + json.dumps(include, separators=(",", ":")))
          # `release` warns about a missing leg by SUFFIX (it greps the artifact names) and
          # `completeness` demands the ASSET name, which is the suffix plus the extension.
          print("assets=" + " ".join(f"{suffix}.{ext}" for _, _, suffix, ext in rows))
          print("targets:", ", ".join(t for _, t, _, _ in rows), file=sys.stderr)
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: [gate, targets]
    runs-on: ${{ matrix.os }}
    # 180 min PER MATRIX ENTRY (t114; report: docs/design/reviews/gen3-ci-timeouts.md §8).
    # The bound comes from the only GREEN release run (34849294052, 2026-09-14): the
    # windows entry took 7677s = 128 min, of which `Build release binary` alone was 7243s
    # (a --release workspace compile; the rust-cache restore was 4s, i.e. it ran COLD).
    # 180 = 1.4x that worst observation: deliberately the smallest multiplier in this
    # repo, because a real release build is already ~2h and a bound near 360 min would
    # not bound anything. The margin is the cold/warm spread that is already measured:
    # the next run's warm windows entry took 3537s (59 min, 2.2x faster), so a false red
    # here is recoverable by re-running -- unlike a silent 6-hour hang, which is what this
    # replaces. `fail-fast: false` is why each entry needs its own bound.
    timeout-minutes: 180
    # `actions: write` is required by upload-artifact (it writes to artifact
    # storage). It is NOT `contents: write`: this job cannot touch repository
    # contents or create releases.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      # THE MATRIX IS NOT WRITTEN HERE (t82): `targets` emits it, so adding a platform is one row
      # in one job and every consumer -- this matrix, the publish pre-check, `completeness` --
      # follows. The entries still carry `os`/`target`/`archive`, which is why every packaging and
      # smoke step below keeps working unchanged. A row without packaging+smoke steps would
      # publish a target nobody ever ran, which is why the steps are keyed on `runner.os`, not on
      # the target name.
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
        with:
          persist-credentials: false # nothing here pushes; do not leave a token in .git/config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-03)
        with:
          # t40 audit F6: WITHOUT this the step installs the action default (stable) and the
          # release build floats -- a zero-diff tag could compile under a new compiler. The
          # value is checked against rust-toolchain.toml by .github/scripts/check-toolchain-pin.sh
          # (release.yml is in its ENFORCED list), so it cannot drift silently.
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (2026-08-06)
      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install -y protoc
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        # lancedb's build script needs protoc on PATH (the build prerequisite in AGENTS.md); the
        # macOS images do not guarantee it, and brew is a no-op when it is already installed.
        run: brew install protobuf
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ruagent
        env:
          CARGO_BUILD_JOBS: "4"
      - name: Build panel
        run: |
          npm ci
          npm run build
        working-directory: panel
      # WHAT DOES THE ONNX RUNTIME COST A DOWNLOADER? Nothing -- and it is MEASURED, because
      # this is the question that gets re-litigated every time someone looks into a cache
      # directory, sees no `onnxruntime.dll` and cannot tell "static" from "lazy"
      # (ruagent-issues-56-59 t43). Four readings, none of them inference:
      #
      #   * `cargo tree -e features -i ort -p ruagent` lists ort's `download-binaries` and NOT
      #     `load-dynamic`: ort-sys links the prebuilt ONNX Runtime IN at build time instead of
      #     dlopen()ing it at run time, so there is no shared object for an archive to carry.
      #   * the import table of the produced binary names 35 DLLs and NO onnx* entry (a scan of
      #     the PE import directory; KERNEL32, MSVCP140, VCRUNTIME140, ws2_32, ...). An
      #     import-lib-linked or load-dynamic build would show up exactly there.
      #   * it DOES import directml.dll / d3d12.dll / dxgi.dll -- the DirectML execution
      #     provider, which is how the statically linked runtime reaches a GPU on Windows.
      #     DirectML ships with Windows 10 1903+ (C:/Windows/System32/DirectML.dll), i.e. the
      #     operating system provides it, not the archive.
      #   * at run time the PACKAGED daemon boots, serves the panel, and reports the embedder it
      #     ended up with through /api/v1/stats -- the smoke step below prints that line. ort's
      #     ONNX SESSION is created lazily by FastEmbedder (which also downloads a model from
      #     HuggingFace), so a missing library would surface as an embedder fallback, on a
      #     machine with no extra files installed.
      # CONCLUSION: no onnxruntime.dll/.so goes into the archive. If an ort bump ever turns
      # `load-dynamic` on, this block is wrong -- and the smoke step's embedder line is where
      # that shows up first.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = 'staging'
          New-Item -ItemType Directory -Force "$staging/panel/dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ruagent.exe" $staging
          # THE ARCHIVE-SIDE PATH IS A CONTRACT (t43). The daemon resolves the panel as
          # RUAGENT_PANEL_DIST, <exe dir>/panel/dist, <build tree>/panel/dist, then
          # <cwd>/panel/dist (crates/daemon/src/api.rs) -- so the archive must carry
          # panel/dist/... . The previous shape copied the directory to panel-dist/, which
          # matches NONE of the four: the user unpacked the release, the API answered, and /
          # returned 404 (the t188 shape, shipped as a release).
          Copy-Item -Path "panel/dist/*" -Destination "$staging/panel/dist" -Recurse -Force
          Copy-Item "README.md" $staging
          Get-ChildItem "LICENSE*" -File | ForEach-Object { Copy-Item $_.FullName $staging }
          # CHECKSUMS OF THE FILES THE ARCHIVE CARRIES; the archive's own checksum goes BESIDE
          # the archive, so a downloader can verify what it downloaded.
          Push-Location $staging
          $stageLen = (Get-Location).Path.Length
          $entries = @(Get-ChildItem -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS' } |
              ForEach-Object { $_.FullName.Substring($stageLen + 1).Replace([char]92, '/') } |
              Sort-Object)
          $lines = @(foreach ($f in $entries) {
              (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLower() + '  ' + $f })
          Set-Content -Path 'SHA256SUMS' -Value $lines -Encoding ascii
          Write-Output 'SHA256SUMS:'
          $lines | ForEach-Object { Write-Output ('  ' + $_) }
          Pop-Location
          # CONTENTS AT THE ARCHIVE ROOT. `-Path $staging` (the directory itself) nests
          # everything under staging/ inside the zip -- an off-by-one-level that the smoke step
          # below catches, and that nobody was reading for before it existed.
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ matrix.archive }}" -Force
          $sum = ((Get-FileHash -Algorithm SHA256 -LiteralPath "${{ matrix.archive }}").Hash.ToLower() + '  /' + "${{ matrix.archive }}")
          Set-Content -Path "${{ matrix.archive }}.sha256" -Value $sum -Encoding ascii
          Write-Output ("archive checksum: " + $sum)
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p staging/panel/dist
          cp target/${{ matrix.target }}/release/ruagent staging/
          # THE ARCHIVE-SIDE PATH IS A CONTRACT (t43, see the Windows leg): <exe dir>/panel/dist
          # is the candidate the daemon actually finds in a package, so the panel goes THERE.
          cp -r panel/dist/. staging/panel/dist/
          cp README.md staging/
          cp LICENSE* staging/ 2>/dev/null || true
          # SHA256SUMS over the files the archive carries; the archive's own sum goes beside it.
          ( cd staging && find . -type f ! -name SHA256SUMS | sed 's|^[.]/||' | LC_ALL=C sort |
              xargs -r sha256sum > SHA256SUMS )
          echo 'SHA256SUMS:'; sed 's/^/  /' staging/SHA256SUMS
          tar czf ${{ matrix.archive }} -C staging .
          sha256sum "${{ matrix.archive }}" | sed 's|^|/|' > "${{ matrix.archive }}.sha256"
          echo "archive checksum: $(cat "${{ matrix.archive }}.sha256")"
          # `| head -5` closed the pipe while tar was still writing, and pipefail turned tar's
          # `stdout: write error` (exit 2) into a failed PACKAGE step on the first real release
          # run -- a race that a small local archive hides. sed reads every line instead.
          echo 'archive contents (first 5):'; tar tzf "${{ matrix.archive }}" | sed -n '1,5p'
      - name: Package (macOS)
        if: runner.os == 'macOS'
        # SAME SHAPE AS THE LINUX LEG, DIFFERENT TOOL NAMES (t44): macOS has no GNU coreutils, so
        # `sha256sum` is `shasum -a 256`, and `xargs -r` does not exist (BSD xargs has no -r and would
        # pass an empty list to sha256sum). A `while read` loop over the sorted list keeps the
        # output byte-compatible with the Linux SHA256SUMS format: "<hex>  <path>".
        run: |
          set -euo pipefail
          mkdir -p staging/panel/dist
          cp "target/${{ matrix.target }}/release/ruagent" staging/
          cp -R panel/dist/. staging/panel/dist/
          cp README.md staging/
          cp LICENSE* staging/ 2>/dev/null || true
          ( cd staging && find . -type f ! -name SHA256SUMS | sed 's|^[.]/||' | LC_ALL=C sort |
              while IFS= read -r f; do shasum -a 256 "$f"; done > SHA256SUMS )
          echo 'SHA256SUMS:'; sed 's/^/  /' staging/SHA256SUMS
          tar czf "${{ matrix.archive }}" -C staging .
          shasum -a 256 "${{ matrix.archive }}" | sed 's|^|/|' > "${{ matrix.archive }}.sha256"
          echo "archive checksum: $(cat "${{ matrix.archive }}.sha256")"
          echo 'archive contents (first 5):'; tar tzf "${{ matrix.archive }}" | sed -n '1,5p'
      # SMOKE: THE ARCHIVE MUST RUN FROM ITS OWN CONTENTS (ruagent-issues-56-59 t43).
      # The release job used to publish whatever it had just zipped and nobody ever unpacked
      # it -- which is how panel-dist/ shipped as a 404. This step unpacks the archive into a
      # temp dir, runs it (--version), starts a real daemon on a free loopback port with a
      # private root, demands /api/v1/health 200 AND / 200 with the PANEL body, then stops it
      # cleanly. It compiles nothing, so a failure here is the archive's fault -- which is the
      # only failure a download-and-run user experiences. Exit 1 = publish nothing.
      - name: Smoke the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/smoke-archive.ps1 -Archive "${{ matrix.archive }}" -Exe ruagent.exe
      - name: Smoke the archive (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/smoke-archive.sh "${{ matrix.archive }}" --exe ruagent
      - name: Smoke the archive (macOS)
        if: runner.os == 'macOS'
        # The SAME script, and it is cross-platform by construction (see its header): no
        # sha256sum/timeout/stat/seq dependency that macOS lacks, a port helper that says what
        # is missing instead of guessing, and an sha256 tool that is detected and FAILS LOUDLY
        # when neither exists. macOS is why those were removed, so this step is the proof they
        # are gone rather than a second copy of the script.
        run: bash .github/scripts/smoke-archive.sh "${{ matrix.archive }}" --exe ruagent
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (2025-03-19)
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Create release
    # `gate` MUST be in `needs` BECAUSE the `if` below reads `needs.gate.result`: a reference to a
    # job that is not a dependency makes the WHOLE FILE invalid, and GitHub then creates a run with
    # NO JOBS and the message 'This run likely failed because of a workflow file issue' -- measured
    # exactly that way on 1e71986, after the same file parsed fine locally as YAML.
    needs: [gate, build, targets]
    # A LEG THAT NEVER GOT A RUNNER MUST NOT WITHHOLD THE ARTIFACTS USERS CAN RUN (2026-11-10).
    # Measured three times on two tags: `Build aarch64-apple-darwin` finished with
    # `conclusion: cancelled` after ~15 minutes and **zero steps** -- GitHub never assigned a macos
    # runner. With `needs: build` and fail-fast false, that one leg left this job SKIPPED, so v0.1.7
    # and v0.1.8 published nothing at all while their windows and linux archives were built, packaged
    # and smoke-tested green. A flaky runner is not a reason to withhold a working download; the
    # `require every target` part of the contract is enforced AFTER publishing, by the
    # `Release completeness` job below, which goes red and names the missing platform.
    # `!cancelled()` keeps the DISPATCH no-publish rule intact (a dispatch never reaches here at all)
    # and `needs.gate.result == 'success'` keeps "a red commit must not be published" exactly as strict.
    if: github.event_name == 'push' && !cancelled() && needs.gate.result == 'success'
    # STILL TAG-ONLY, BY EVENT (ruagent-issues-56-59 t44): a dispatch must be able to prove a new
    # target builds WITHOUT the ability to publish (the condition is the event, not the `dry_run`
    # input), and check-release-version.sh has already made the tag agree with the binary. What
    # changed above is only what happens when a leg could not build AT ALL.
    runs-on: ubuntu-latest
    # 30 min (t114). This job is `gh`/API only: on the green run (34849294052) the whole
    # job was 21s and `Create GitHub release` itself was 8s; the longest this leg has ever
    # taken is 612s (10.2 min, in the 2026-09-17 run, where the step then FAILED -- i.e.
    # even a failing API leg burns ~10 min). 30 min = 3x that worst observation and ~85x
    # the green one: it bounds a hung API/upload call without being near a real success.
    # What it does NOT name is WHICH command hung -- report §8 / t114's §19 note.
    timeout-minutes: 30
    # The ONE job that writes: creating the release. `actions: read` is what
    # download-artifact needs; nothing else is granted.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4 (2025-04-24)
        with:
          path: artifacts
          merge-multiple: true
      # Publishing what EXISTS is allowed only if something exists: with every leg failed there is
      # nothing to attach, and a release with no assets is worse than no release -- a downloader
      # would find the tag and nothing to fetch. This stops loudly rather than skipping silently.
      - name: Say what will be published, and refuse to publish nothing
        env:
          # THE PLATFORM LIST IS DERIVED (t82), not a second hand-kept copy.
          ASSETS: ${{ needs.targets.outputs.assets }}
        run: |
          set -eu
          count=$(find artifacts -maxdepth 1 -type f | wc -l)
          echo "artifacts to publish: $count"
          find artifacts -maxdepth 1 -type f -printf '  %f\n' | sort || true
          if [ "$count" -eq 0 ]; then
            echo '::error::no artifacts were produced, so there is nothing to publish: every build leg failed or was cancelled'
            exit 1
          fi
          missing=''
          # THE PLATFORM LIST COMES FROM `targets` (t82), not from a second hand-kept copy:
          # `x86_64-linux.tar.gz` -> `x86_64-linux`, which is what the artifact names carry.
          for a in $ASSETS; do
            p="${a%%.*}"
            ls artifacts/*"$p"* >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::warning::publishing WITHOUT:$missing -- that build leg produced no archive. The run ends red via 'Release completeness'."
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (2026-04-12)
        with:
          generate_release_notes: true
          files: artifacts/*

  completeness:
    name: Release completeness
    needs: [build, release, targets]
    # THE STRICT HALF, AFTER PUBLISHING (2026-11-10). Every target must have produced an archive.
    # If one did not, the release still went out -- because the other platforms were built, packaged
    # and smoke-tested, and a downloader should not be told 'nothing for you' because a macos runner
    # was never assigned -- and this job goes RED naming the gap, so it cannot go unnoticed.
    # A dispatch publishes nothing and therefore has nothing to be complete about.
    if: always() && github.event_name == 'push' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Every platform archive must be attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ASSETS: ${{ needs.targets.outputs.assets }}
        run: |
          set -eu
          assets=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | sort)
          echo "attached to $TAG:"; echo "$assets"
          missing=''
          # THE SAME ONE LIST (t82): the asset names come from `targets`, so a platform added to
          # the matrix can never leave this check demanding an archive nobody builds (red forever)
          # or accepting a release that is missing one (silently incomplete).
          for p in $ASSETS; do
            echo "$assets" | grep -q -- "$p" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::the release is MISSING:$missing. What IS published works -- download it. Then re-run the failed leg (gh run rerun --failed <run-id>) and publish the gap; do not move the tag."
            exit 1
          fi
          echo 'every platform archive in the target list, and its checksum, is attached'
