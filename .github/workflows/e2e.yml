name: E2E

# End-to-end smoke against a real daemon: boot, doctor (7 checks),
# panel serving. Runs on main pushes after CI, cheap addition.
#
# EVIDENCE DISCIPLINE (t65, report §5): the Playwright suite has ONE entry point,
# `panel/e2e/run-e2e.mjs` (npm run test:e2e), and the reason is a data-loss-shaped
# one: `registry.spec.ts` writes the daemon's real agents.toml and is guarded by
# `writeAccess()`, which is true only when RUAGENT_E2E_ALLOW_WRITES=1 -- a flag
# that only run-e2e.mjs sets. A bare `npx playwright test` therefore SKIPS that
# spec, silently, and the run looks green with the write path unmeasured. The
# `Entry-point guard` step below makes that a continuously checked property of the
# repo instead of a fact someone read once; the counting step makes every skipped
# spec visible.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUAGENT_EMBEDDER: hash

jobs:
  smoke:
    name: Daemon + doctor + panel smoke
    runs-on: ubuntu-latest
    # 30 min (t111; report: docs/design/reviews/gen3-ci-timeouts.md). Observed 222-499s across
    # 8 runs -- the slow legs are the daemon boot, `doctor`, the panel build and the whole
    # Playwright suite (now including the JSON skip-naming verdict from t110). 3.6x the worst
    # observation, and it bounds a hang (in the daemon, the browser or a spec) to 30 minutes
    # instead of GitHub's 360-minute default. It does NOT name what hung.
    timeout-minutes: 30
    # t110 follow-up: the JSON evidence path lives HERE, once, and BOTH steps below
    # read this same variable. The previous shape wrote a literal in the run step and
    # read a literal in the evidence step, and CI showed they did not agree (`5c0bc8f`:
    # "no Playwright JSON report at /home/runner/work/_temp/t65/playwright.json").
    #
    # `PW_TEST_REPORTER` is the deterministic carrier: `createReporters()` appends it
    # unconditionally (playwright/lib/runner/index.js:5221), independent of how the
    # config's reporter list and the CLI `--reporter` flags get merged -- and that
    # merge is what made the file appear locally and vanish on the runner. CI=true
    # swaps the config's reporters (panel/playwright.config.ts:81); measured in that
    # exact shape: `--reporter=json` + `_NAME`/`_FILE` produced NO file at all, while
    # `PW_TEST_REPORTER=json` + `PLAYWRIGHT_JSON_OUTPUT_FILE` produced it at the named
    # absolute path (66-68 KB, JSON.parse-able) in all three shapes tested.
    #
    # The path below uses the `github` context ON PURPOSE. It was `runner.temp`, which
    # is NOT available in a job-level env: GitHub validates contexts statically and
    # rejects the WHOLE file -- run 36510848293 (commit 02dea44) died in 0s with no
    # jobs and "This run likely failed because of a workflow file issue", while ci.yml
    # with the same pinned SHAs and the same timeout keys loaded fine. A YAML parser
    # cannot see that layer, which is exactly why the guard's expression check passed.
    env:
      PW_TEST_REPORTER: json
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/playwright-evidence.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-03; the TOOLCHAIN still floats -- see the report)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (2026-08-06)
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Coverage declaration (what a green here does NOT mean)
        run: |
          {
            echo "### E2E smoke -- NOT covered by this job"
            echo ""
            echo "* **the Rust test suite**: this job builds binaries, it runs no"
            echo "  \`cargo test\`, so a failing Rust test is invisible here (the \`CI\`"
            echo "  workflow's jobs are the ones that run them)."
            echo "* **the panel type check**: \`npm run build\` runs here, so a TS error"
            echo "  would fail the job, but the dedicated \`panel\` job is the declared"
            echo "  gate for it."
            echo "* **Windows**: this job is ubuntu only."
            echo "* **the 8 live-COPY instruments** (store 3, graph 3, knowledge 2): no"
            echo "  real \`~/.ruagent\` on a runner; they are named in the \`CI\` workflow's"
            echo "  ignored-instrument manifest."
            echo ""
            echo "Counting unit here: no Rust test targets run (this job only builds"
            echo "them), so the evidence is the exit code plus the Playwright summary"
            echo "line counts (passed / failed / flaky / skipped) and the skipped-test"
            echo "markers."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The entry point is a GATE, not a habit (AGENTS.md, t65). If package.json
      # stops routing test:e2e through run-e2e.mjs, or run-e2e.mjs stops arming
      # the write flag, the suite would silently skip its only writing spec -- so
      # this step reads both files and fails loudly instead.
      - name: Entry-point guard (test:e2e must go through run-e2e.mjs)
        run: |
          set -euo pipefail
          script=$(node -e "console.log(require('./panel/package.json').scripts['test:e2e'])")
          echo "panel/package.json scripts.test:e2e = $script"
          if [ "$script" != "node e2e/run-e2e.mjs" ]; then
            echo "::error::panel test:e2e is '$script', not 'node e2e/run-e2e.mjs'. The write-guarded spec (registry.spec.ts) only runs through the repo entry point; a bare 'npx playwright test' skips it silently (AGENTS.md, t65)."
            exit 1
          fi
          grep -q 'RUAGENT_E2E_ALLOW_WRITES' panel/e2e/run-e2e.mjs || {
            echo "::error::panel/e2e/run-e2e.mjs no longer sets RUAGENT_E2E_ALLOW_WRITES: every write-guarded spec would skip itself."
            exit 1
          }
          echo "entry point OK: npm run test:e2e -> node e2e/run-e2e.mjs, which arms writes"

      - name: Build
        run: cargo build -p ruagent -p ruagent-mock-agent
      - name: Build panel
        run: |
          npm ci
          npm run build
        working-directory: panel
      - name: Register e2e mock agents
        # Two scripted fan-out members + the judge behavior: lets the
        # Playwright suite exercise the full fan-out judge loop (design
        # §5.2/§5.3) against real runs, without spending real agents.
        run: |
          mkdir -p ~/.ruagent/config
          root="$HOME/.ruagent"
          bin="$PWD/target/debug/ruagent-mock-agent"
          printf '[{"marker":"FANOUT MARKER","reply":"answer from alpha"},{"marker":"CHAT MARKER","reply":"answer from alpha chat"}]' > "$root/config/e2e-alpha.json"
          printf '[{"marker":"FANOUT MARKER","reply":"answer from beta"}]' > "$root/config/e2e-beta.json"
          cat > "$root/config/agents.toml" <<EOF
          [agent.alpha]
          harness = "mock"
          command = "$bin --behavior scripted --replies $root/config/e2e-alpha.json"
          description = "e2e fan-out member"

          [agent.beta]
          harness = "mock"
          command = "$bin --behavior scripted --replies $root/config/e2e-beta.json"
          description = "e2e fan-out member"

          [agent.judge]
          harness = "mock"
          command = "$bin --behavior judge"
          description = "e2e fan-out judge"
          EOF
          cat "$root/config/agents.toml"
      - name: Boot daemon
        run: |
          cargo run -p ruagent -- serve --addr 127.0.0.1:8787 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/v1/health
      - name: Doctor (7 end-to-end checks)
        run: cargo run -p ruagent -- doctor
      - name: Panel serves
        run: |
          html=$(curl -sf http://127.0.0.1:8787/)
          echo "$html" | grep -q 'id="root"'
          curl -sf http://127.0.0.1:8787/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 | grep -q .
      - name: Panel E2E (Playwright)
        # through the repo entry point on purpose: this is the line that arms the
        # write guard. Change it to `npx playwright test` and registry.spec.ts
        # skips itself -- which the Entry-point guard and the counting step below
        # both exist to make impossible to miss.
        #
        # t104: `--reporter=list` is not decoration. The CI default comes from
        # panel/playwright.config.ts (`github` + `html`), whose log holds only
        # "1 skipped" -- a count with no NAME, i.e. an undecidable reading (rule
        # 19). `list` prints every spec with its status; `html` keeps feeding the
        # upload-artifact step. No `panel/**` file is touched for this.
        run: |
          set -o pipefail
          npx playwright install chromium --with-deps
          mkdir -p "$RUNNER_TEMP/t65"
          set +e
          # t110: `--reporter=list` is NOT enough for skips, and the CI run proved it
          # (`5d3adfd`: "1 skipped", "0 named"). Measured on a real local run against
          # a temp-root daemon: with SIX skipped tests, `--reporter=list` printed
          # exactly one relevant line, `6 skipped` -- the list reporter names the
          # tests it RUNS, but a skip is only counted. The JSON reporter does carry
          # them (stats.skipped + per-spec tests[].status == "skipped" with file and
          # title), so it is written to a file here and read by the evidence step,
          # which FAILS when it counts a skip it cannot name -- so this cannot rot
          # back into a green no-op. `html` keeps feeding the upload-artifact step.
          # No output-file path here: `PW_TEST_REPORTER: json` (job env) carries the
          # reporter and `PLAYWRIGHT_JSON_OUTPUT_FILE` (same env block) carries the
          # absolute path both steps agree on. `--reporter=json` is dropped from the CLI
          # so the json reporter cannot be instantiated twice against one file.
          npm run test:e2e -- --reporter=list --reporter=html 2>&1 | tee "$RUNNER_TEMP/t65/playwright.log"
          rc=${PIPESTATUS[0]}
          set -e
          # t104: the state comes from the command (`PIPESTATUS[0]`, since `tee`
          # would otherwise hide it), never from a `job.status` expression: in
          # GitHub expressions `0` is falsy, so `success && 0 || 1` is ALWAYS 1.
          echo "$rc" > "$RUNNER_TEMP/t65/playwright.rc"
          echo "playwright exit code: $rc"
          exit "$rc"
        working-directory: panel

      # Skipped specs are the silent-success shape of this suite, so they must be
      # NAMED, not counted (rule 19). The names come from the JSON report -- the
      # text log's `N skipped` line is a number, and a number is not a reading.
      # Only a skipped registry.spec.ts is fatal: that spec arms the write guard, so
      # its absence means the daemon's real config path was never exercised.
      - name: E2E evidence (spec counts + exit code, skips named)
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/t65/playwright.log"; rcfile="$RUNNER_TEMP/t65/playwright.rc"
          json="${PLAYWRIGHT_JSON_OUTPUT_FILE:?}"; names="$RUNNER_TEMP/t65/skipped-names.txt"
          upstream="Panel E2E (Playwright)"
          if [ ! -r "$log" ] || [ ! -r "$rcfile" ]; then
            {
              echo "### E2E smoke -- Playwright evidence: NO READING"
              echo ""
              echo "No log/exit code, because \`$upstream\` did not run: an earlier step"
              echo "failed (\`Build\`, \`Boot daemon\`, \`Doctor\`, ...). **Derivative notice,"
              echo "not a Playwright failure.** The red is the earlier step."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=$(cat "$rcfile")
          passed=$(grep -cE '^ *[0-9]+ passed' "$log" || true)
          failed=$(grep -cE '^ *[0-9]+ failed' "$log" || true)
          flaky=$(grep -cE '^ *[0-9]+ flaky' "$log" || true)
          skipped=$(grep -cE '^ *[0-9]+ skipped' "$log" || true)

          # ---- the NAMED skips, from the JSON report ------------------------------
          if [ ! -r "$json" ]; then
            echo "::error::no Playwright JSON report at $json (\$PLAYWRIGHT_JSON_OUTPUT_FILE, defined once in the job env) -- this leg cannot name a skipped spec. It is written by `PW_TEST_REPORTER=json` in the run step (t110; CI 5c0bc8f proved a CLI-specified path is not reliable): a skip that cannot be named must never be reported as green."
            exit 1
          fi
          set +e
          node - "$json" > "$names" 2>"$RUNNER_TEMP/t65/json-err.txt" <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const out = [];
          const walk = (s) => {
            for (const sp of s.specs || []) {
              const statuses = (sp.tests || []).map((t) => t.status);
              if (statuses.includes("skipped")) {
                const reasons = (sp.tests || [])
                  .flatMap((t) => (t.annotations || []).filter((a) => a.type === "skip").map((a) => a.description))
                  .filter(Boolean);
                out.push(`${sp.file} :: ${sp.title}${reasons.length ? " :: " + reasons[0] : ""}`);
              }
            }
            for (const c of s.suites || []) walk(c);
          };
          for (const s of r.suites || []) walk(s);
          console.log("JSON_REPORTED_SKIPPED=" + ((r.stats || {}).skipped ?? "unknown"));
          for (const n of out) console.log("SKIPPED_SPEC|" + n);
          NODE
          node_rc=$?
          set -e
          if [ "$node_rc" -ne 0 ]; then
            echo "::error::the Playwright JSON report at $json could not be parsed (exit $node_rc): $(cat "$RUNNER_TEMP/t65/json-err.txt" | head -3 | tr '\n' ' ') -- without it a skip cannot be named, so this leg cannot be green."
            exit 1
          fi
          json_skipped=$(sed -n 's/^JSON_REPORTED_SKIPPED=//p' "$names" || true)
          named=$(grep -c '^SKIPPED_SPEC|' "$names" || true)
          skip_list=$(sed -n 's/^SKIPPED_SPEC|//p' "$names" || true)
          {
            echo "### E2E smoke -- Playwright evidence"
            echo ""
            echo "| line class | count |"
            echo "| --- | --- |"
            echo "| summary \`N passed\` lines | $passed |"
            echo "| summary \`N failed\` lines | $failed |"
            echo "| summary \`N flaky\` lines | $flaky |"
            echo "| summary \`N skipped\` lines (text log, a NUMBER only) | $skipped |"
            echo "| JSON report \`stats.skipped\` | $json_skipped |"
            echo "| **named skipped specs** | **$named** |"
            echo "| exit code | $rc |"
            echo ""
            echo "skipped specs, by NAME (file :: title :: reason):"
            if [ "$named" -gt 0 ]; then printf '%s\n' "$skip_list"; else echo "(none: no spec was skipped)"; fi
            if [ "$json_skipped" = "0" ]; then
              echo ""
              echo "**CONFIRMED: no spec was skipped in this run** -- the JSON report itself says"
              echo "\`stats.skipped = 0\`, which is a different fact from \"a skip existed and could not"
              echo "be named\" (t110: that case is an \`::error::\` below, never a green)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # A skip we counted but cannot name is exactly the t104 failure shape
          # (CI: "1 skipped" / "0 named"): refuse it rather than report green.
          if [ "$json_skipped" = "unknown" ] || [ "$json_skipped" != "$named" ]; then
            echo "::error::the JSON report says $json_skipped skipped spec(s) but $named could be NAMED. An unnamed skip is not a reading (t110/t104): fix the reporter/parser rather than accept a green."
            exit 1
          fi
          if printf '%s\n' "$skip_list" | grep -q 'registry\.spec\.ts'; then
            echo "::error::registry.spec.ts was SKIPPED: that spec writes the daemon's real agents.toml and only runs when RUAGENT_E2E_ALLOW_WRITES=1, i.e. through npm run test:e2e. A skip here means the write path was not exercised (t65)."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Playwright run failed (exit $rc)"
            exit 1
          fi

          # ---- the MEASURED count (t166) ---------------------------------------
          # The guards above make a SKIP visible; none of them notices a run whose
          # specs all "passed" because most of them never RAN. `0 failed` and
          # `0 measured` are different facts, and only the first had a guard -- so a
          # named, legitimate-looking skip (wiki.spec.ts with no wiki pages, chat
          # with no mock agent registered, ...) could still leave a GREEN run whose
          # summary hides that its coverage is gone.
          #
          # The floor below is a READING, not a taste: six consecutive successful
          # E2E runs -- 37138197234, 37139111120, 37141299806, 37192592208,
          # 37194596042, 37196424418 (2026-10-03/04) -- each printed
          # `62 passed (...)`, 0 failed, 0 flaky and `JSON says 0 skipped / 0 named`
          # in this very step. 62 is therefore what this suite measures on the CI
          # daemon today. A rise is fine; a DROP is the thing this guard is for.
          # Updating it is allowed ONLY with a new reading of the same kind.
          E2E_MEASURED_FLOOR=62
          set +e
          node - "$json" > "$RUNNER_TEMP/t65/json-counts.txt" 2>&1 <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const c = { expected: 0, unexpected: 0, flaky: 0, skipped: 0, total: 0 };
          const walk = (s) => {
            for (const sp of s.specs || []) {
              for (const t of sp.tests || []) {
                c.total += 1;
                if (t.status === "expected") c.expected += 1;
                else if (t.status === "unexpected") c.unexpected += 1;
                else if (t.status === "flaky") c.flaky += 1;
                else if (t.status === "skipped") c.skipped += 1;
              }
            }
            for (const ch of s.suites || []) walk(ch);
          };
          for (const s of r.suites || []) walk(s);
          const st = r.stats || {};
          const g = (k) => (st[k] === undefined ? "?" : st[k]);
          console.log(
            "JSON_COUNTS measured=" + (c.expected + c.unexpected + c.flaky) +
            " passed=" + c.expected + " failed=" + c.unexpected + " flaky=" + c.flaky +
            " skipped=" + c.skipped + " collected=" + c.total +
            " stats_expected=" + g("expected") + " stats_unexpected=" + g("unexpected") +
            " stats_flaky=" + g("flaky") + " stats_skipped=" + g("skipped"),
          );
          NODE
          counts_rc=$?
          set -e
          if [ "$counts_rc" -ne 0 ]; then
            echo "::error::the measured-test counts could not be read out of $json (node exit $counts_rc): $(head -3 "$RUNNER_TEMP/t65/json-counts.txt" | tr '\n' ' '). Without them this leg cannot tell '0 failed' from '0 measured', so it is not green."
            exit 1
          fi
          counts=$(cat "$RUNNER_TEMP/t65/json-counts.txt")
          m_measured=$(printf '%s\n' "$counts" | sed -n 's/.*measured=\([0-9]*\).*/\1/p')
          m_passed=$(printf '%s\n' "$counts" | sed -n 's/.*passed=\([0-9]*\).*/\1/p')
          m_failed=$(printf '%s\n' "$counts" | sed -n 's/.*failed=\([0-9]*\).*/\1/p')
          m_flaky=$(printf '%s\n' "$counts" | sed -n 's/.*flaky=\([0-9]*\).*/\1/p')
          m_skipped=$(printf '%s\n' "$counts" | sed -n 's/.*skipped=\([0-9]*\).*/\1/p')
          m_collected=$(printf '%s\n' "$counts" | sed -n 's/.*collected=\([0-9]*\).*/\1/p')
          s_expected=$(printf '%s\n' "$counts" | sed -n 's/.*stats_expected=\([^ ]*\).*/\1/p')
          s_unexpected=$(printf '%s\n' "$counts" | sed -n 's/.*stats_unexpected=\([^ ]*\).*/\1/p')
          s_flaky=$(printf '%s\n' "$counts" | sed -n 's/.*stats_flaky=\([^ ]*\).*/\1/p')
          # Two independent readings of the same fact must agree (the per-spec walk
          # and the report's own stats block). If they do not, the PARSER is what is
          # broken and a count is not a reading -- refuse it rather than pass it on.
          if [ "$s_expected" != "?" ] && [ "$((m_passed + m_failed + m_flaky))" != "$((s_expected + s_unexpected + s_flaky))" ]; then
            echo "::error::the JSON report disagrees with itself: per-spec statuses say $((m_passed + m_failed + m_flaky)) measured (passed=$m_passed failed=$m_failed flaky=$m_flaky) while stats says $((s_expected + s_unexpected + s_flaky)) (expected=$s_expected unexpected=$s_unexpected flaky=$s_flaky). Fix the parser before believing either."
            exit 1
          fi
          {
            echo ""
            echo "| measured tests (passed + failed + flaky) | $m_measured |"
            echo "| collected (measured + skipped) | $m_collected |"
            echo "| reference floor for this suite | $E2E_MEASURED_FLOOR (six CI runs 2026-10-03/04, all \`62 passed\`) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # `flaky` counts as MEASURED: a flaky test failed and was retried into a
          # pass, so the suite did exercise it. Excluding it would let a retry-heavy
          # run look smaller than it is; including it cannot hide an unmeasured test.
          m_ran=$((m_passed + m_failed + m_flaky))
          if [ "$m_ran" -lt "$E2E_MEASURED_FLOOR" ]; then
            echo "::error::only $m_ran test(s) were MEASURED, below the floor of $E2E_MEASURED_FLOOR (passed=$m_passed failed=$m_failed flaky=$m_flaky skipped=$m_skipped of $m_collected collected). '0 failed' is not '0 measured': this run's green does not cover $((E2E_MEASURED_FLOOR - m_ran)) test(s) that the reference runs covered, and nothing else in this step failed. Find what turned them into skips (a fixture/mock-agent/wiki-data regression) -- or, if a test was deliberately deleted, raise the floor in the same commit WITH a new reading."
            exit 1
          fi

          # ---- the MUST-RUN set (t166) -----------------------------------------
          # Not "no spec may skip": the data-dependent skips (no wiki pages, no
          # enabled agent, no probe doc) are legitimate and stay legitimate -- this
          # is what turns a skip from INVISIBLE-with-a-green-job into a red one.
          # Each entry is here for its OWN reason. registry.spec.ts is enforced
          # verbatim above (t65) and is deliberately not repeated.
          for pair in \
            "recall.spec.ts|the recall chain (query -> stubs -> inline expand) is that spec's subject alone; its old unconditional skip hid 'recall matched no memories' and t113's lesson is that a skip is not coverage" \
            "consumption.spec.ts|it is the only spec that exercises all four consumption legs (a memory, a recall_log row, a document AND an entity) and asserts each one; skipping it silences the whole consumption surface while the job stays green" \
            "failure-visibility.spec.ts|it asserts that failures are VISIBLE (error text, not an empty state) and that an absence is read through a bounded window -- skipping it silences that whole class, whose false-green is how this generation lost a measurement before" \
            "chat.spec.ts|it needs a registered mock agent, so its skip is the fingerprint of a fixture regression that would also silence judge.spec.ts; a missing mock agent must not be a quieter green" \
            "settings-capabilities.spec.ts|the second write-guarded spec: its skip means the daemon's policy.toml [capabilities] path was never exercised (same t65-class reason as registry.spec.ts, a different config file)"; do
            spec="${pair%%|*}"
            why="${pair#*|}"
            if printf '%s\n' "$skip_list" | grep -q "$spec"; then
              echo "::error::$spec was SKIPPED, but it is in the must-run set: $why. (t166: the skip is named -- that is not the problem; the problem is that a named skip still leaves this job green.)"
              exit 1
            fi
          done
          echo "measured: $m_ran test(s) >= floor $E2E_MEASURED_FLOOR; must-run set (recall, consumption, failure-visibility, chat, settings-capabilities) all executed"

          echo "playwright: exit 0, JSON says $json_skipped skipped / $named named, none of them registry.spec.ts"

      - name: Upload Playwright artefacts
        # An E2E red must be readable from the run itself. An E2E failure once
        # came back with a 403 on the job log, so the failing assertion was
        # unreadable -- and it could not be reproduced locally either (the
        # suite skips the spec when the mock agents are not registered). The
        # trace and the HTML report are the only record of what happened, so
        # they are uploaded even on success: 'which tests were skipped' is
        # exactly the question a green run gets asked.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (2025-03-19)
        with:
          name: playwright-artifacts
          path: |
            panel/test-results
            panel/playwright-report
          if-no-files-found: warn
          retention-days: 7
