name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # lancedb's lance-encoding needs protoc at build time
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # t324/t327: Db::call returns Result<Result<..>> whenever the closure
      # returns a rusqlite result, so the two layers mean different things --
      # the outer is "the writer thread is gone", the inner is "the SQL failed"
      # -- and the outer is almost never the one that goes wrong. Judging only
      # the outer (`.await.is_err()` / `.is_ok()`) therefore stays green while
      # the statement failed: a check that can never fail. t324 found 0 such
      # sites in the tree (and 17 places where the same nesting hid a failure);
      # this step keeps the first kind from coming back. Use `Db::call_flat`,
      # or `matches!(.., Ok(Err(_)))` when both layers matter.
      - name: Guard against nested-Result misjudgement
        run: |
          set -eu
          hits=$(grep -rn --include='*.rs' -A8 '\.call(' crates cli                  | grep -E '\.await[[:space:]]*\.(is_err|is_ok)\(\)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Db::call(..).await.is_err()/.is_ok() judges only the OUTER layer of a nested Result (t324/t327). Use Db::call_flat, or match Ok(Err(_)) explicitly."
            echo "$hits"
            exit 1
          fi
          echo "no nested-Result misjudgement found"

      - name: Test
        run: cargo test --workspace
        env:
          # Knowledge tests prefer real embeddings; offline CI uses the
          # deterministic hash embedder fallback (same as first boot).
          RUAGENT_EMBEDDER: hash

  # Windows is a first-class platform (design §3) but costs 2x CI minutes,
  # so it runs on main pushes only.
  rust-windows:
    name: Rust (windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: choco install -y protoc
      - name: Test
        # The lancedb/datafusion graph is heavy; low parallelism dodges
        # Windows DLL-init failures, and the retry absorbs the known
        # lance rmeta race (E0786 invalid metadata) — the second run is
        # incremental and almost always clean.
        run: cargo test --workspace || cargo test --workspace
        env:
          CARGO_BUILD_JOBS: "2"
          RUAGENT_EMBEDDER: hash

  panel:
    name: Panel (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install
        working-directory: panel
        run: npm ci
      # The audit guards 54 criteria by parsing thresholds out of the contract.
      # Its self-test is the only thing that can catch the two ways that guard
      # goes silently wrong: an anchor that stops matching the contract cell and
      # falls back to a built-in default, and the reconcile declaration drifting
      # from the expected value. Both happened on 2026-09-24 and were found only
      # because a human re-ran this by hand.
      # It is a separate step so a failure names the instrument, not the build.
      # 433ms, no browser, no daemon, no network: the self-test branch never
      # reaches chromium.launch, so it does not need Playwright's browsers.
      - name: Audit self-test
        working-directory: panel
        run: node tools/design-audit.mjs --self-test
      - name: Typecheck + build
        working-directory: panel
        run: |
          npx tsc -b
          npm run build
