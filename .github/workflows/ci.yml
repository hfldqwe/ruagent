name: CI

# EVIDENCE DISCIPLINE (t65, report: docs/design/reviews/gen2-ci-hardening.md)
#
# This generation collected four families of "a green that measured nothing",
# each with a real cost:
#   1. AN EMPTY RUN -- with no `#[ignore]`d tests, `cargo test -- --ignored`
#      exits 0 and prints "0 passed ... N filtered out" (measured in t36). So a
#      run's metric here is the number of TARGETS that reported (0 is an error),
#      per-target `test result:` lines and the exit code -- never a sum of passes.
#   2. A CACHED GREEN -- a `-D`-only change does not invalidate fingerprints, so
#      "no diagnostics" can come from a build that never re-checked the crate.
#   3. A STALE-BINARY GREEN/RED -- the reading came from an older executable.
#   4. A SILENT SKIP -- a missing precondition `return`ing early is counted as
#      `passed`; and a bare `npx playwright test` lets the write-guarded spec
#      skip itself silently.
#
# What that means in this file: every test step tees its output and runs
# `scripts/test-evidence.sh` over it; every `#[ignore]`d instrument is either RUN
# with `--include-ignored` (and its name demanded in the log) or NAMED in the
# manifest step with the reason it cannot run here; and every job declares what it
# does NOT cover.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Knowledge tests prefer real embeddings; offline CI uses the deterministic hash
  # embedder fallback (same as first boot).
  RUAGENT_EMBEDDER: hash

jobs:
  rust-linux:
    name: Rust (ubuntu)
    runs-on: ubuntu-latest
    # BOUND THE HANG, NOT THE SPEED (t111; report: docs/design/reviews/gen3-ci-timeouts.md).
    # Longest real observation: 542s (9.0 min, the first GREEN run 36507120586); the red runs
    # exit in 25-265s, so nothing near this is ever legitimate. 30 min = 3.3x the worst and
    # leaves room for a cold rust-cache (a full workspace compile on top of the 9-minute green
    # workload). Without this key GitHub applies its 360-minute default, which is what made
    # "hung" and "slow" indistinguishable in run 36508184462.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head (2026-09-03), kept SHA-pinned like every other action here
        with:
          # PINNED TOOLCHAIN (user's decision, 2026-10-04; see rust-toolchain.toml).
          # The action selects the toolchain from its @rev -- its README says so --
          # so this input is what pins the runner's INSTALL; `rust-toolchain.toml`
          # (also 1.95.0) is what pins what the commands RUN: rustup prints
          # `stable-… (overridden by '…/rust-toolchain.toml')` in this repo, so the
          # file governs cargo/rustc here regardless of what the runner installed.
          # Raise both carriers together (rust-toolchain.toml + this input, here and
          # in rust-windows).
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (2026-08-06)
      # lancedb's lance-encoding needs protoc at build time
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # F1 GUARD: every path a workflow EXECUTES must be tracked, in the same
      # commit. Its own reason to exist: this file references
      # `.github/workflows/scripts/test-evidence.sh` and
      # `.github/workflows/scripts/check-workflow-refs.sh`, and an UNTRACKED step
      # script does not make the pipeline weaker -- it makes it red on the first
      # push. The guard is deliberately an under-approximation (executable
      # positions only, paths resolved against the step's `working-directory`,
      # prose excluded); its two measured false positives are recorded in the
      # script's header.
      - name: "Guard: workflow-referenced paths must be tracked"
        run: bash .github/workflows/scripts/check-workflow-refs.sh

      # ---------------------------------------------------------------- coverage
      # Declared BEFORE the greens on purpose: a reader must know what a green
      # here does not mean (t53 read a script name and got the history wrong; the
      # cure is stating coverage next to the claim, not in a wiki).
      - name: Coverage declaration (what a green here does NOT mean)
        run: |
          {
            echo "### Rust (ubuntu) -- NOT covered by this job"
            echo ""
            echo "* **the panel**: \`panel/**\` is not a Rust package, so a TypeScript"
            echo "  type error, a broken antd prop or a dead import is invisible to"
            echo "  every step below. That is the \`panel\` job and the \`E2E\` workflow."
            echo "* **Windows-specific paths**: MAIN_SEPARATOR handling, DLL init order,"
            echo "  \`MAX_PATH\`, drive-letter case, the lance rmeta race -- the"
            echo "  \`Rust (windows)\` job (main pushes only)."
            echo "* **the live-COPY instruments that need real history** (8 of them:"
            echo "  store 3, graph 3, knowledge 2). They are NAMED in the manifest step"
            echo "  below with the reason; a CI runner has no \`~/.ruagent\` database and"
            echo "  no e5 model, and their whole point is real data -- see the manifest."
            echo "* **the Playwright suite** (its own workflow, needs a daemon +"
            echo "  browsers) and **coverage of anything outside the workspace manifest**."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # t324/t327: Db::call returns Result<Result<..>> whenever the closure
      # returns a rusqlite result, so the two layers mean different things --
      # the outer is "the writer thread is gone", the inner is "the SQL failed"
      # -- and the outer is almost never the one that goes wrong. Judging only
      # the outer (`.await.is_err()` / `.is_ok()`) therefore stays green while
      # the statement failed: a check that can never fail. t324 found 0 such
      # sites in the tree (and 17 places where the same nesting hid a failure);
      # this step keeps the first kind from coming back. Use `Db::call_flat`,
      # or `matches!(.., Ok(Err(_)))` when both layers matter.
      - name: Guard against nested-Result misjudgement
        run: |
          set -eu
          hits=$(grep -rn --include='*.rs' -A8 '\.call(' crates cli                  | grep -E '\.await[[:space:]]*\.(is_err|is_ok)\(\)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Db::call(..).await.is_err()/.is_ok() judges only the OUTER layer of a nested Result (t324/t327). Use Db::call_flat, or match Ok(Err(_)) explicitly."
            echo "$hits"
            exit 1
          fi
          echo "no nested-Result misjudgement found"

      # ------------------------------------------------------------- the run
      # `--no-fail-fast` is NOT cosmetic (captain's ruling, t65): cargo stops
      # launching further test targets as soon as one fails, so without it the
      # "targets reporting" count below is structurally incomplete -- one early
      # red hides every later target's reading, and the "0 targets = error" guard
      # cannot see what never ran. Measured: an unfixed workspace run reported 7
      # targets and stopped, while the workspace has 21+.
      - name: Test (default run -- skips stay countable)
        id: linux_test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/t65"
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/t65/linux-default.log"
          rc=${PIPESTATUS[0]}
          set -e
          # THE STATE COMES FROM THE COMMAND, NOT FROM AN EXPRESSION (t104). The
          # earlier shape judged this run with a job.status-based ternary
          # (`job.status == 'success' && 0 || 1`), and in GitHub expressions `0` is
          # FALSY: `true && 0` evaluates to `0`, so the `|| 1` branch takes over and
          # the value is ALWAYS 1. That made the evidence step red on every run --
          # including runs where every earlier step succeeded (E2E run 36480566583:
          # all steps green, Playwright 44 passed / 1 skipped, evidence still printed
          # `| exit code | 1 |`). A judgement step that can never be green is worse
          # than none: it drowns the real red. Here the recorded code IS this step's
          # exit code, so the numbers and the step conclusion cannot disagree.
          echo "$rc" > "$RUNNER_TEMP/t65/linux-default.rc"
          echo "default run exit code: $rc"
          exit "$rc"

      - name: Test evidence (per-target counts + exit code)
        if: always()
        run: |
          log="$RUNNER_TEMP/t65/linux-default.log"; rcfile="$RUNNER_TEMP/t65/linux-default.rc"
          upstream="Test (default run -- skips stay countable)"
          if [ ! -r "$log" ] || [ ! -r "$rcfile" ]; then
            {
              echo "### Rust (ubuntu) -- default run: NO READING"
              echo ""
              echo "There is no log and no exit code, because \`$upstream\` did not run: a"
              echo "step before it failed (usually \`Clippy\` -- every later step is skipped"
              echo "unless it is \`if: always()\`). Nothing was measured here, so there is"
              echo "nothing to count. **This is a derivative notice, not a test failure**;"
              echo "the red is the earlier step."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A tree that does not compile produces a log with a compiler error and 0
          # reporting targets. That is the COMPILE face's red, not a test result, so
          # it is reported as a notice instead of a second red -- while a genuinely
          # empty run (no compiler error, still nothing reported) keeps failing
          # below, which is what this step is for.
          if [ "$(grep -c '^test result:' "$log" || true)" = "0" ] && grep -qE '^error(\[|:)|could not compile' "$log"; then
            {
              echo "### Rust (ubuntu) -- default run: NO READING (the tree does not compile)"
              echo ""
              echo "\`cargo test\` stopped at the compiler, so no test ran. See the failing"
              echo "build/\`Clippy\` step above. **Derivative notice, not a test failure.**"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '^error(\[|:)|could not compile' "$log" | head -5 || true
            exit 0
          fi
          bash .github/workflows/scripts/test-evidence.sh \
            "Rust (ubuntu) -- default run" "$log" "$(cat "$rcfile")"

      # ------------------------------------------- the ignored instruments
      # THE SATISFIABLE ONE. The eight daemon instruments in
      # `crates/daemon/tests/injection_e2e.rs` need `ruagent-mock-agent` next to
      # the test binary -- and `cargo test --workspace` just built it there. Their
      # body-head `expect(NEEDS_MOCK)` means a missing binary is a FAILURE, not a
      # silent pass (t37), so running them here is the positive reading; the
      # negative one (missing binary => FAILED) is in the report §2.
      #
      # Each name is DEMANDED in the log: with `--include-ignored` alone, a test
      # could still be skipped by a *new* `#[ignore]` and the summary would not
      # notice it.
      - name: Ignored instruments CI can satisfy (daemon / mock-agent present)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/t65"
          set +e
          cargo test -p ruagent-daemon --test injection_e2e -- --include-ignored \
            2>&1 | tee "$RUNNER_TEMP/t65/linux-daemon-ignored.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$RUNNER_TEMP/t65/linux-daemon-ignored.rc"
          echo "daemon instrumentation exit code: $rc"
          bash .github/workflows/scripts/test-evidence.sh \
            "Rust (ubuntu) -- daemon instrumentation (--include-ignored)" \
            "$RUNNER_TEMP/t65/linux-daemon-ignored.log" "$rc" \
            run_injects_memory_knowledge_and_wiki \
            run_without_knowledge_documents_has_no_knowledge_block \
            chat_injects_memory_knowledge_and_wiki \
            chat_without_knowledge_documents_has_no_knowledge_block \
            chat_and_run_use_the_same_block_wording \
            both_paths_emit_the_contract_truncation_marker \
            a_retried_run_carries_the_shared_retry_prefix \
            chat_event_carries_the_injection_budget_report
          exit "$rc"

      # ------------------------------------------- the manifest of the rest
      # Visible skip accounting. `--ignored --list` is the source of truth for
      # which tests exist but are not run by default; the step compares it to the
      # DECLARED sets, so a new `#[ignore]` cannot appear silently and an old one
      # cannot disappear silently either.
      - name: Ignored-instrument manifest (what does NOT run here, and why)
        if: always()
        run: |
          set -uo pipefail
          set +e
          cargo test --workspace -- --ignored --list > "$RUNNER_TEMP/t65/ignored-list.txt" 2>&1
          list_rc=$?
          set -e
          # t104: `--list` cannot even build the test binaries when the tree does not
          # compile. That is the compile face's red, not a skip-accounting mismatch,
          # so it becomes a notice pointing upstream instead of a second red.
          if [ "$list_rc" -ne 0 ]; then
            {
              echo "### Ignored-instrument manifest: NO READING"
              echo ""
              echo "\`cargo test --workspace -- --ignored --list\` could not run (exit"
              echo "\`$list_rc\`): the tree does not compile, or a build step above failed."
              echo "No skip accounting is possible. **Derivative notice, not a count"
              echo "mismatch.** The red is the failing build step."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            tail -20 "$RUNNER_TEMP/t65/ignored-list.txt" || true
            exit 0
          fi
          found=$(grep -cE ': test$' "$RUNNER_TEMP/t65/ignored-list.txt" || true)

          # RUN by the step above (8). Their names are demanded there.
          covered=8
          # DECLARED NOT COVERED here (8). CI has no ~/.ruagent database and no e5
          # model; these instruments' subject IS the real history, so a synthetic
          # fixture would not measure them (an empty copy is rejected by their own
          # non-vacuity assertions, t33/t36) -- that is why they are named instead
          # of faked.
          declared_not_covered=8
          expected=$((covered + declared_not_covered))

          {
            echo "### Ignored instruments: skip accounting"
            echo ""
            echo "\`cargo test --workspace -- --ignored --list\` found **$found** ignored test(s);"
            echo "this job accounts for **$expected** ($covered run with \`--include-ignored\`,"
            echo "$declared_not_covered declared not covered below)."
            echo ""
            echo "| ignored test | disposition here |"
            echo "| --- | --- |"
            echo "| \`injection_e2e\`: 8 names | RUN (\`--include-ignored\`, mock binary built by \`cargo test --workspace\`) |"
            echo "| \`store\`: live_copy_keeps_history_nullable, live_copy_upgrades_…, live_copy_bigram_backfill_at_scale | NOT RUN: needs \`RUAGENT_T6_LIVE_COPY\` = a migrated COPY of a real database (and for t25 a PRE-0024 copy). A fresh DB cannot show the history-NULL clause at all -- that is the clause under test. Satisfiable only on a machine with a real \`~/.ruagent\`. |"
            echo "| \`graph\`: community_coverage_and_multihop_on_the_real_graph, redundant_pairs_on_the_real_graph_go_to_zero, the_real_query_frame_through_the_new_legs | NOT RUN: needs \`RUAGENT_GRAPH_LIVE_COPY\` = a COPY of the real graph DB; the instrument refuses any path containing \`.ruagent\` and asserts the source's object set, so a synthetic DB does not measure it. |"
            echo "| \`knowledge\`: live_copy_gold_set, live_copy_evidence_and_run_record | NOT RUN: needs \`RUAGENT_IA_LIVE_COPY\` = a COPY of a live root WITH the corpus (934 docs) and the e5 model; the C1/C2/C9 readings are properties of that corpus. |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$found" -ne "$expected" ]; then
            echo "::error::ignored-test count changed: found $found, this job accounts for $expected. A new #[ignore] must be either RUN with --include-ignored (and its name demanded in the test-evidence call) or DECLARED here with its reason -- silently skipping is not an option (t65)."
            echo "--- found ---"; cat "$RUNNER_TEMP/t65/ignored-list.txt"
            exit 1
          fi
          echo "skip accounting OK: $found ignored = $covered run + $declared_not_covered declared"

  # Windows is a first-class platform (design §3) but costs 2x CI minutes,
  # so it runs on main pushes only.
  rust-windows:
    name: Rust (windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # 60 min (t111). The longest real observation is 1310s = 21.8 min (run 36486678888), and
    # that single number ALREADY contains one test pass; `Test attempt 2` runs a second
    # near-full pass when attempt 1 fails at the test level, and a cold rust-cache adds a
    # whole workspace compile on the slowest platform. No bound here may kill a legitimately
    # slow run (measured spread: 25s cancelled .. 1310s), so this is deliberately generous --
    # a hang must become a bounded failure instead of 6 hours of an `in_progress` run. What it
    # does NOT say is WHICH test hung: report §19 / t111's out-of-scope list.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head (2026-09-03), kept SHA-pinned like every other action here
        with:
          # SAME PIN as rust-linux and as rust-toolchain.toml: 1.95.0. Both runners
          # must install the same compiler, or a green here and a green there are
          # greens of DIFFERENT tools (which is what pinning exists to stop).
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (2026-08-06)
      - name: Install protoc
        run: choco install -y protoc

      - name: Coverage declaration (what a green here does NOT mean)
        shell: bash
        run: |
          {
            echo "### Rust (windows) -- NOT covered by this job"
            echo ""
            echo "**A green here is NOT a green on the guard suite.** Measured step lists (\`ci.yml\`, read with PyYAML, not from memory): \`rust-linux\` has 13 steps, this job has 9, and the guards below exist **only in \`rust-linux\`** -- so this job passing says **nothing** about any of them."
            echo ""
            echo "* **Format** (\`cargo fmt --all --check\`): \`rust-linux\` step 7. Not run here."
            echo "* **Clippy** (\`cargo clippy --workspace --all-targets -- -D warnings\`): \`rust-linux\` step 8. Not run here."
            echo "* **Guard against nested-Result misjudgement**: \`rust-linux\` step 9. Not run here."
            echo "* **The ignored-instrument accounting** -- \`Ignored instruments CI can satisfy\` (step 12) **and** \`Ignored-instrument manifest\` (step 13), which is the one that compares \`--ignored --list\` to the declared sets. Not run here."
            echo "* **Guard: workflow-referenced paths must be tracked** (\`bash .github/workflows/scripts/check-workflow-refs.sh\`): \`rust-linux\` step 5. Not run here."
            echo ""
            echo "That is not a hypothetical: in run 37139111136 the ubuntu job failed at \`Ignored-instrument manifest\` (\`ignored-test count changed: found 16, this job accounts for 15\`) **while this job was green (10m12s)**. A green here would have looked like \"the skip accounting passed\"; it meant \"the skip accounting did not run\"."
            echo ""
            echo "**What this job DOES cover, and how.** \`Test attempt 1\` runs \`cargo test --workspace --no-fail-fast\`, and \`Test attempt 1 evidence\` prints every target's counts against that attempt's exit code; \`Test attempt 2 (only for the known build race)\` re-runs it **only when attempt 1 shows no test-level failure**, with the same evidence step (\`Test attempt 2 evidence\`). So a green here IS a full default-run workspace test on Windows -- and nothing beyond it."
            echo ""
            echo "* **the panel** (its own job) and **the Playwright suite** (its own workflow)."
            echo "* **the 8 live-COPY instruments** (store 3, graph 3, knowledge 2): same reason as the ubuntu job's manifest -- no real \`~/.ruagent\` and no e5 model on a runner."
            echo "* **the ubuntu job's \`--include-ignored\` instrumentation of the daemon 8**: this job builds them too, but does not demand those 8 names; the ubuntu job is the one that does."
            echo "* **the panel job's \`Audit self-test\`** (that job, step 5): a green here says nothing about it either."
            echo "* **anything only a non-main push would catch**: this job runs on main pushes only, so it does not run on pull requests."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------- attempt 1 + retry
      # THE RETRY IS NOT UNCONDITIONAL ANY MORE (t65). Evidence from the run of
      # 2026-09-26 (job 108488556558): attempt 1 failed with
      # `distill_graph_toggle_controls_entity_extraction ... FAILED` +
      # `panicked at crates\mock-agent\tests\e2e_daemon.rs:2161` and attempt 2
      # reproduced it exactly (`test result: FAILED. 22 passed; 1 failed`), while
      # `E0786` -- the lance rmeta race the retry was written for -- never appeared
      # in the log: the retry doubled the wall clock and absorbed nothing.
      #
      # A build-level race is a *build* failure. A test-level failure is never that
      # race, so: retry ONLY when attempt 1 shows no test-level failure, and print
      # every attempt's counts either way.
      - name: Test attempt 1
        id: attempt1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t65"
          set +e
          cargo test --workspace --no-fail-fast > "$RUNNER_TEMP/t65/win-attempt1.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/t65/win-attempt1.rc"
          tail -40 "$RUNNER_TEMP/t65/win-attempt1.log"
          echo "attempt 1 exit code: $rc"
          # t104: the step's OWN exit code must be the command's. Before this, the
          # step ended with `echo` (always 0), so `steps.attempt1.outcome` never said
          # "failure" -- and attempt 2, guarded by exactly that, could never fire
          # (measured: skipped on 0da0cb6). Same root as the always-1 `rc` expression.
          exit "$rc"
        env:
          CARGO_BUILD_JOBS: "2"

      - name: Test attempt 1 evidence
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/t65/win-attempt1.log"; rcfile="$RUNNER_TEMP/t65/win-attempt1.rc"
          if [ ! -r "$log" ] || [ ! -r "$rcfile" ]; then
            {
              echo "### Rust (windows) -- attempt 1: NO READING"
              echo ""
              echo "No log/exit code, because \`Test attempt 1\` did not run (an earlier step"
              echo "failed, or the job was cancelled). **Derivative notice, not a test"
              echo "failure.** The red is the earlier step."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(grep -c '^test result:' "$log" || true)" = "0" ] && grep -qE '^error(\[|:)|could not compile' "$log"; then
            {
              echo "### Rust (windows) -- attempt 1: NO READING (the tree does not compile)"
              echo ""
              echo "\`cargo test\` stopped at the compiler. **Derivative notice, not a test"
              echo "failure.**"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '^error(\[|:)|could not compile' "$log" | head -5 || true
            exit 0
          fi
          bash .github/workflows/scripts/test-evidence.sh \
            "Rust (windows) -- attempt 1" "$log" "$(cat "$rcfile")"

      - name: Test attempt 2 (only for the known build race)
        if: failure() && steps.attempt1.outcome == 'failure'
        shell: bash
        run: |
          log="$RUNNER_TEMP/t65/win-attempt1.log"
          if grep -qE 'panicked at|^test result: FAILED' "$log"; then
            echo "::error::attempt 1 failed with a TEST-level failure. The documented flake is a BUILD race (lance rmeta / E0786), which never shows as a test failure -- so retrying would hide a real red behind a lucky second run. Stopping here with attempt 1's evidence above."
            exit 1
          fi
          echo "attempt 1 failed without a test-level failure (build/toolchain level) -> retrying once"
          set +e
          cargo test --workspace --no-fail-fast > "$RUNNER_TEMP/t65/win-attempt2.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/t65/win-attempt2.rc"
          tail -40 "$RUNNER_TEMP/t65/win-attempt2.log"
          bash .github/workflows/scripts/test-evidence.sh \
            "Rust (windows) -- attempt 2 (retry)" "$RUNNER_TEMP/t65/win-attempt2.log" "$rc"
        env:
          CARGO_BUILD_JOBS: "2"

      - name: Test attempt 2 evidence
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/t65/win-attempt2.log"; rcfile="$RUNNER_TEMP/t65/win-attempt2.rc"
          if [ ! -r "$log" ] || [ ! -r "$rcfile" ]; then
            echo "attempt 2 did not run (attempt 1 was clean, or its failure was test-level)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash .github/workflows/scripts/test-evidence.sh \
            "Rust (windows) -- attempt 2" "$log" "$(cat "$rcfile")"
          fi

  panel:
    name: Panel (node)
    runs-on: ubuntu-latest
    # 15 min (t111): observed 23-37s across 20+ runs (this job is `npm ci` + the audit
    # self-test + the typecheck/build). The only part with no local reading is the network
    # install on a cold runner, so the bound is a floor, not 3x the measurement: it exists to
    # turn a hang into a 15-minute failure, never to hurry a real install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (2025-04-02)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Coverage declaration (what a green here does NOT mean)
        run: |
          {
            echo "### Panel (node) -- NOT covered by this job"
            echo ""
            echo "* **Rust, entirely**: no \`cargo\` step runs here; a Rust compile error,"
            echo "  a clippy lint or a failing Rust test is invisible to this job."
            echo "* **the Playwright e2e suite**: separate workflow (\`E2E\`), needs a real"
            echo "  daemon plus browsers. Its write-guarded spec only runs through"
            echo "  \`panel/e2e/run-e2e.mjs\`."
            echo "* **runtime behaviour of the built bundle**: this job type-checks and"
            echo "  builds; a bundle that builds and then breaks in a browser is the E2E"
            echo "  workflow's job."
            echo ""
            echo "Counting unit here: there are no Rust test targets in this job, so the"
            echo "evidence below is the exit code plus the \`error TS\` / \`error\` line count"
            echo "of \`node scripts/build-panel.mjs\` (which itself runs i18n-check,"
            echo "\`tsc -b\`, the e2e tsconfig check and then vite -- AGENTS.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install
        working-directory: panel
        run: npm ci
      # The audit guards 54 criteria by parsing thresholds out of the contract.
      # Its self-test is the only thing that can catch the two ways that guard
      # goes silently wrong: an anchor that stops matching the contract cell and
      # falls back to a built-in default, and the reconcile declaration drifting
      # from the expected value. Both happened on 2026-09-24 and were found only
      # because a human re-ran this by hand.
      # It is a separate step so a failure names the instrument, not the build.
      # 433ms, no browser, no daemon, no network: the self-test branch never
      # reaches chromium.launch, so it does not need Playwright's browsers.
      - name: Audit self-test
        working-directory: panel
        run: node tools/design-audit.mjs --self-test

      # The type check is INSIDE npm run build (panel/scripts/build-panel.mjs runs
      # i18n-check, `tsc -b`, the e2e tsconfig check, then vite; any non-zero step
      # aborts before dist is written -- AGENTS.md). `npx tsc -b` is kept in front
      # of it because it names the type error first; it is not the only coverage.
      - name: Typecheck + build (with counts)
        working-directory: panel
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/t65"
          set +e
          { npx tsc -b && npm run build; } > "$RUNNER_TEMP/t65/panel-build.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/t65/panel-build.log"
          ts_errors=$(grep -cE 'error TS[0-9]+' "$RUNNER_TEMP/t65/panel-build.log" || true)
          other_errors=$(grep -cE '^error|ERROR' "$RUNNER_TEMP/t65/panel-build.log" || true)
          {
            echo "### Panel build evidence"
            echo ""
            echo "| line class | count |"
            echo "| --- | --- |"
            echo "| \`error TS<code>\` | $ts_errors |"
            echo "| other \`error\`-shaped lines | $other_errors |"
            echo "| exit code | $rc |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::panel typecheck/build failed (exit $rc): $ts_errors TS error(s)"
            exit 1
          fi
          echo "panel build: exit 0, $ts_errors TS error(s)"
