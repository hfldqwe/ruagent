name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # lancedb's lance-encoding needs protoc at build time
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          # Knowledge tests prefer real embeddings; offline CI uses the
          # deterministic hash embedder fallback (same as first boot).
          RUAGENT_EMBEDDER: hash

  # Windows is a first-class platform (design §3) but costs 2x CI minutes,
  # so it runs on main pushes only.
  rust-windows:
    name: Rust (windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: choco install -y protoc
      - name: Test
        # The lancedb/datafusion graph is heavy; low parallelism dodges
        # Windows DLL-init failures, and the retry absorbs the known
        # lance rmeta race (E0786 invalid metadata) — the second run is
        # incremental and almost always clean.
        run: cargo test --workspace || cargo test --workspace
        env:
          CARGO_BUILD_JOBS: "2"
          RUAGENT_EMBEDDER: hash

  panel:
    name: Panel (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Typecheck + build
        working-directory: panel
        run: |
          npm ci
          npx tsc -b
          npm run build
