[package]
name = "ruagent-daemon"
description = "Daemon assembly: local HTTP/WS API over the core crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Real-harness smoke tests: local, manual, never in CI (design §12.5).
# Run with: cargo test -p ruagent-daemon --features smoke --test smoke -- --nocapture --test-threads=1
smoke = []

[dependencies]
ruagent-core.workspace = true
ruagent-acp.workspace = true
ruagent-store.workspace = true
ruagent-policy.workspace = true
agent-client-protocol = "2.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
