[package]
name = "ruagent-daemon"
description = "Daemon assembly: local HTTP/WS API over the core crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Real-harness smoke tests: local, manual, never in CI (design §12.5).
# Run with: cargo test -p ruagent-daemon --features smoke --test smoke -- --nocapture --test-threads=1
smoke = []

[dependencies]
ruzstd = "0.7"
# Native folder picker (the workspace dialog — the browser cannot read
# absolute local paths, but the daemon is a local process and can).
# xdg-portal, not the default gtk3: the portal backend is pure Rust
# (no compile-time GTK/wayland libs — CI runners would need apt
# packages otherwise); the Windows backend is unaffected by features.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ruagent-core.workspace = true
ruagent-acp.workspace = true
ruagent-store.workspace = true
ruagent-policy.workspace = true
ruagent-orchestrator.workspace = true
ruagent-memory.workspace = true
ruagent-knowledge.workspace = true
ruagent-graph.workspace = true
ruagent-mcp.workspace = true
agent-client-protocol = "2.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"
toml_edit = "0.23"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
ruagent-knowledge.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
