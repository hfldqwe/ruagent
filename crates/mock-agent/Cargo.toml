[package]
name = "ruagent-mock-agent"
description = "Scriptable mock ACP agent — the CI test backbone"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-client-protocol = "2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
ruagent-acp.workspace = true
ruagent-core.workspace = true
ruagent-daemon.workspace = true
ruagent-store.workspace = true
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
