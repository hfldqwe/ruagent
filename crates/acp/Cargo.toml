[package]
name = "ruagent-acp"
description = "ACP client (JSON-RPC over stdio) and harness adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ruagent-core.workspace = true
agent-client-protocol = "2.1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
